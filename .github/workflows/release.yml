name: Release

# The Aoxn artifact is ONE file: `Aoxn-<version>-Setup.exe`, the installer stub
# with the compiler, standard library, UI toolkit and examples appended to it.
# A tagged `vX.Y.Z` builds it on windows-latest, installs from it into a
# scratch prefix to prove it works, and attaches it to the GitHub release.
# `workflow_dispatch` builds without publishing, so packaging changes can be
# checked on a PR.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to package (defaults to the manifest version)"
        required: false

permissions:
  contents: write

jobs:
  build:
    name: windows-x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-release-

      # only clang — the compiler itself has no LLVM dependency (v0.29.0).
      # The MSVC Build Tools ship with the windows runner image.
      - name: Install clang (LLVM toolchain)
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Build and package (one exe)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --release --locked
          powershell -ExecutionPolicy Bypass -File dist\package.ps1 -Output dist\release -SkipBuild

      - name: Verify the installer (install into a scratch prefix, doctor, run)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $setup = (Get-ChildItem "dist\release\*Setup.exe").FullName
          # `aoxn-setup.exe` is a WINDOWS_GUI subsystem binary (PE subsystem 2),
          # because double-clicking it must not flash a console window. The
          # PowerShell call operator does NOT wait for a GUI-subsystem process and
          # does NOT set $LASTEXITCODE from it -- so `& $setup` returned while the
          # installer was still running, $LASTEXITCODE was still UNSET, and
          # `if ($LASTEXITCODE -ne 0)` fired on `$null -ne 0`. That threw "the
          # installer reported a failure" while doctor was still printing
          # "status: ok" underneath it; the ordering in the log was the tell.
          # `Start-Process -Wait -PassThru` waits for a GUI process and reports
          # its real exit code, which is what the gate actually means.
          $proc = Start-Process -FilePath $setup -ArgumentList @("-Console", "-Prefix", $prefix) -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "the installer reported a failure (exit $($proc.ExitCode))" }
          $aoxn = Join-Path $prefix "bin\aoxn.exe"
          # Check for the binary BEFORE invoking it. Without this, a file
          # that vanished between install and use (Windows Defender /
          # Smart App Control quarantining a freshly written, unsigned exe
          # after its first run) surfaces as "The term ... is not
          # recognized as a name of a cmdlet" -- an error that blames the
          # shell and tells the reader nothing about what actually happened.
          if (-not (Test-Path $aoxn)) {
            throw @"
          bin\aoxn.exe is missing from the install prefix right after a
          successful install. This is almost always antivirus / Smart App
          Control quarantining the freshly unpacked, unsigned binary on its
          first execution, not a packaging fault. Check the runner's
          Defender exclusions, or re-run the job.
          "@
          }
          & $aoxn run (Join-Path $prefix "examples\stdlib_demo.ax") | Out-Null
          & $aoxn doctor | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "the installed toolchain failed doctor" }

      - uses: actions/upload-artifact@v4
        with:
          name: aoxn-setup
          path: dist/release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Checksums
        shell: pwsh
        run: |
          cd artifacts/aoxn-setup
          Get-ChildItem *.exe | ForEach-Object {
            "$((Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLower())  $($_.Name)"
          } | Tee-Object -FilePath SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/aoxn-setup/*
          body: |
            ## Aoxn ${{ github.ref_name }} — Windows

            One file installs everything. Download `Aoxn-${{ github.ref_name }}-Setup.exe`,
            double-click it, and `aoxn` ends up on your PATH.

            ```
            aoxn run examples\hello.ax
            aoxn doctor        # verify any install
            ```

            The installer unpacks the compiler, the standard library, the UI
            toolkit and the examples into `%LOCALAPPDATA%\aoxn`, and installs
            LLVM through winget when clang is missing. Linking on Windows also
            needs the MSVC Build Tools (`winget install
            Microsoft.VisualStudio.2022.BuildTools`); `aoxn doctor` detects
            them when they are absent.
