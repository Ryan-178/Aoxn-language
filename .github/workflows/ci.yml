name: CI

on:
  push:
    branches: [main]
  pull_request:

# Validation ownership:
# - This workflow: compiler/pipeline/stdlib/TS/UI tests and explicit pkg tests
#   on Windows + Linux; Linux also exercises the X11 backend under Xvfb.
# - release.yml: Windows installer packaging/install/doctor/run smoke checks
#   on version tags or manual dispatch, not on every push.
# - web-bench.yml: Windows web functional parity + reference benchmark, with
#   its own web/** path filters; root Cargo tests do not run that suite.
# - IDE: excluded from the root Cargo workspace and NOT validated here.
#   Separate checks: cargo test --manifest-path ide/src-tauri/Cargo.toml,
#   pnpm --dir ide test, and pnpm --dir ide typecheck (see ide/package.json).
jobs:
  # Windows is the FIRST-CLASS platform: Win32/GDI and WinHTTP tests run here.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # the compiler itself no longer links LLVM (v0.29.0: C-emitting
      # backend); the LLVM install provides the clang driver it compiles with
      - name: Install clang (LLVM toolchain)
        shell: pwsh
        run: |
          winget install --id LLVM.LLVM --accept-source-agreements --accept-package-agreements --silent
          Add-Content $env:GITHUB_PATH "C:\Program Files\LLVM\bin"

      - name: Build
        run: cargo build

      # A non-virtual workspace defaults to the root package, not every member.
      - name: Test compiler (pipeline, stdlib, TS, UI)
        run: cargo test -p aoxn --locked

      # Use Cargo directly: run_pkg_tests.sh is a local Windows SAC workaround,
      # and its unreferenced stamp does not guarantee a new binary hash.
      - name: Test package manager
        run: cargo test -p aoxn-pkg --locked

      - name: Smoke test
        shell: pwsh
        run: |
          cargo run -- run examples\hello.ax
          if ($LASTEXITCODE -ne 0) { throw "hello.ax failed (exit $LASTEXITCODE)" }
          cargo run -- run examples\strings.ax
          if ($LASTEXITCODE -ne 0) { throw "strings.ax failed (exit $LASTEXITCODE)" }
          cargo run -- run examples\stdlib_demo.ax
          if ($LASTEXITCODE -ne 0) { throw "stdlib_demo.ax failed (exit $LASTEXITCODE)" }
          cargo run -- build examples\primes.ax -o primes.exe
          if ($LASTEXITCODE -ne 0) { throw "primes build failed (exit $LASTEXITCODE)" }
          $count = .\primes.exe
          if ($LASTEXITCODE -ne 0) { throw "primes execution failed (exit $LASTEXITCODE)" }
          if ("$count" -ne "9592") { throw "primes returned $count, expected 9592" }

  # Linux: compiler and package-manager tests plus the X11 UI backend,
  # linked against libX11/libXft and driven for 30 real frames under Xvfb.
  # The Windows-only surface (installer, WinHTTP) is not covered here.
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # clang compiles the generated C; the X headers are needed to LINK a
      # ui_x11 program (X11 + Xft + their fontconfig/freetype deps)
      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libx11-dev libxft-dev libfontconfig1-dev xvfb

      - name: Build
        run: cargo build

      # A non-virtual workspace defaults to the root package, not every member.
      - name: Test compiler (pipeline, stdlib, TS, UI)
        run: cargo test -p aoxn --locked

      # Use Cargo directly: run_pkg_tests.sh is a local Windows SAC workaround,
      # and its unreferenced stamp does not guarantee a new binary hash.
      - name: Test package manager
        run: cargo test -p aoxn-pkg --locked

      - name: Smoke test
        run: |
          cargo run -- run examples/hello.ax
          cargo run -- run examples/strings.ax
          cargo run -- run examples/stdlib_demo.ax
          cargo run -- build examples/primes.ax -o primes
          count=$(./primes)
          if [ "$count" != "9592" ]; then echo "primes returned $count, expected 9592"; exit 1; fi

      - name: X11 backend probe (Xvfb)
        run: |
          cargo run -- build examples/ui_probe_x11.ax -o ui-probe -l X11 -l Xft
          xvfb-run -a ./ui-probe
