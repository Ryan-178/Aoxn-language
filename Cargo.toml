[workspace]
members = ["crates/aoxn-pkg"]
# The Aoxn IDE (ide/src-tauri) is deliberately its own workspace: it is a
# desktop application with its own dependency set and its own build, and
# folding it in here would make a plain `cargo test` at the repo root compile
# a Tauri app. Tauri builds it from ide/ via `pnpm ide:build`.
exclude = ["ide/src-tauri"]
resolver = "2"

[package]
name = "aoxn"
version = "0.50.0"
# Two [[bin]] targets live here (aoxn + the aoxn-setup installer stub); a
# bare `cargo run -- run examples\hello.ax` needs this key or cargo refuses
# to pick a default binary — the CI smoke test failed on exactly that
# ("could not determine which binary to run"), and every documented command
# in README/AGENTS.md uses the bare form.
default-run = "aoxn"
edition = "2021"
description = "Aoxn: AI-native compiled programming language"

# the compiler lib itself (src/) uses no external crates; this dependency is
# linked for the `aoxn` binary only (pkg-management subcommands live in the
# separate aoxn-pkg crate)
[dependencies]
aoxn-pkg = { path = "crates/aoxn-pkg" }

[[bin]]
name = "aoxn"
path = "src/main.rs"

# the Windows installer stub: `dist/package.ps1` appends the toolchain payload
# to this binary to produce the single-file `Aoxn-<version>-Setup.exe`
[[bin]]
name = "aoxn-setup"
path = "src/setup/main.rs"

[lib]
name = "aoxn"
path = "src/lib.rs"

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = true
