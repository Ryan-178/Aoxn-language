[package]
name = "aoxn-pkg"
version = "0.40.0"
edition = "2021"
description = "Aoxn package manager (aoxn pkg / aoxn add / ...)"

[dependencies]
clap = { version = "4", default-features = false, features = ["std", "help", "usage", "error-context", "suggestions", "derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
pubgrub = "0.3"
sha2 = "0.10"
hex = "0.4"
flate2 = "1"
tar = "0.4"
dirs = "5"
thiserror = "1"
